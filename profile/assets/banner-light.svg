<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="EpiFive">
<title>EpiFive — open-source SaaS and IT engineering resources</title>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f5f6f4"/><stop offset=".55" stop-color="#ffffff"/><stop offset="1" stop-color="#e3f1ec"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" x2="1">
    <stop offset="0" stop-color="#0a7560" stop-opacity="0"/><stop offset=".5" stop-color="#0a7560" stop-opacity=".5"/><stop offset="1" stop-color="#0a7560" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#d9dee1" stroke-width="1"/>
  </pattern>
</defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .l1{animation:up .7s ease-out .1s both}.l2{animation:up .7s ease-out .35s both}.l3{animation:up .7s ease-out .6s both}.l4{animation:up .7s ease-out .85s both}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .sweep{animation:sweep 6s linear infinite}
  @keyframes sweep{from{transform:translateX(-420px)}to{transform:translateX(1620px)}}
  .dot{animation:blink 2.4s ease-in-out infinite}.d2{animation-delay:.4s}.d3{animation-delay:.8s}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  .cursor{animation:cur 1s steps(1) infinite}@keyframes cur{50%{opacity:0}}
</style>
<rect width="1200" height="300" rx="18" fill="url(#g)"/>
<rect width="1200" height="300" rx="18" fill="url(#grid)" opacity=".55"/>
<rect class="sweep" x="0" y="0" width="420" height="300" fill="url(#shine)" opacity=".18"/>
<g transform="translate(70 0)">
  <g class="l1">
    <rect x="0" y="58" width="58" height="58" rx="14" fill="#0a7560"/>
    <text x="29" y="98" font-size="30" font-weight="800" fill="#f5f6f4" text-anchor="middle">E5</text>
    <text x="78" y="102" font-size="46" font-weight="800" fill="#14181d" letter-spacing="-1">EpiFive</text>
  </g>
  <text class="l2" x="0" y="160" font-size="24" font-weight="600" fill="#14181d">Open-source SaaS you can self-host — and IT guides written up properly.</text>
  <text class="l3" x="0" y="196" font-size="17" fill="#65707b">Next.js 16 · TypeScript · MySQL, SQLite or PostgreSQL · MIT licensed · live demos<tspan class="cursor" fill="#0a7560"> ▍</tspan></text>
  <g transform="translate(0 228)"><g class="l4" font-size="15" font-weight="600">
    <rect width="170" height="36" rx="18" fill="#e3f1ec" stroke="#0a7560"/>
    <text x="85" y="23" fill="#0a7560" text-anchor="middle">9 SaaS products</text>
    <rect x="184" width="170" height="36" rx="18" fill="#e3f1ec" stroke="#0a7560"/>
    <text x="269" y="23" fill="#0a7560" text-anchor="middle">12 public repos</text>
    <rect x="368" width="150" height="36" rx="18" fill="#e3f1ec" stroke="#0a7560"/>
    <text x="443" y="23" fill="#0a7560" text-anchor="middle">MIT licensed</text>
  </g></g>
</g>
<g transform="translate(1080 50)">
  <circle class="dot" cx="0" cy="0" r="6" fill="#0a7560"/><circle class="dot d2" cx="22" cy="0" r="6" fill="#b5791b"/><circle class="dot d3" cx="44" cy="0" r="6" fill="#0a7560"/>
</g>
</svg>
