<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="EpiFive">
<title>EpiFive — open-source SaaS you can self-host</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7faf8"/><stop offset="1" stop-color="#e7f3ee"/></linearGradient>
  <linearGradient id="txt" x1="0" x2="1"><stop offset="0" stop-color="#0a7560"/><stop offset=".55" stop-color="#4f5bd5"/><stop offset="1" stop-color="#b5791b"/></linearGradient>
  <radialGradient id="o1"><stop offset="0" stop-color="#0a7560" stop-opacity=".55"/><stop offset="1" stop-color="#0a7560" stop-opacity="0"/></radialGradient>
  <radialGradient id="o2"><stop offset="0" stop-color="#4f5bd5" stop-opacity=".45"/><stop offset="1" stop-color="#4f5bd5" stop-opacity="0"/></radialGradient>
  <radialGradient id="o3"><stop offset="0" stop-color="#b5791b" stop-opacity=".35"/><stop offset="1" stop-color="#b5791b" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#d6e0dc" stroke-width="1"/></pattern>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a7560" stop-opacity="0"/><stop offset=".5" stop-color="#0a7560" stop-opacity=".22"/><stop offset="1" stop-color="#0a7560" stop-opacity="0"/></linearGradient>
  <clipPath id="clip"><rect width="1200" height="400" rx="22"/></clipPath>
</defs>
<style>
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .o1{animation:d1 14s ease-in-out infinite}.o2{animation:d2 18s ease-in-out infinite}.o3{animation:d3 16s ease-in-out infinite}
  @keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(160px,60px)}}
  @keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-180px,-40px)}}
  @keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(-90px,70px)}}
  .scan{animation:scan 7s linear infinite}@keyframes scan{from{transform:translateY(-140px)}to{transform:translateY(540px)}}
  .in1{animation:in .8s ease-out .1s both}.in2{animation:in .8s ease-out .3s both}.in3{animation:in .8s ease-out .5s both}.in4{animation:in .8s ease-out .7s both}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .float{animation:fl 6s ease-in-out infinite}.f2{animation-delay:-2s}.f3{animation-delay:-4s}
  @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .bar{transform-origin:14px 0;animation:bar 3.6s ease-in-out infinite}.b1{animation-delay:-.9s}.b2{animation-delay:-1.8s}.b3{animation-delay:-2.7s}
  @keyframes bar{0%,100%{transform:scaleX(.25)}50%{transform:scaleX(1)}}
  .w0{animation:w0 21.599999999999998s infinite}@keyframes w0{0%,0.00%{opacity:0;transform:translateY(14px)}2.00%,9.11%{opacity:1;transform:none}11.11%,100%{opacity:0;transform:translateY(-14px)}}
  .w1{animation:w1 21.599999999999998s infinite}@keyframes w1{0%,11.11%{opacity:0;transform:translateY(14px)}13.11%,20.22%{opacity:1;transform:none}22.22%,100%{opacity:0;transform:translateY(-14px)}}
  .w2{animation:w2 21.599999999999998s infinite}@keyframes w2{0%,22.22%{opacity:0;transform:translateY(14px)}24.22%,31.33%{opacity:1;transform:none}33.33%,100%{opacity:0;transform:translateY(-14px)}}
  .w3{animation:w3 21.599999999999998s infinite}@keyframes w3{0%,33.33%{opacity:0;transform:translateY(14px)}35.33%,42.44%{opacity:1;transform:none}44.44%,100%{opacity:0;transform:translateY(-14px)}}
  .w4{animation:w4 21.599999999999998s infinite}@keyframes w4{0%,44.44%{opacity:0;transform:translateY(14px)}46.44%,53.56%{opacity:1;transform:none}55.56%,100%{opacity:0;transform:translateY(-14px)}}
  .w5{animation:w5 21.599999999999998s infinite}@keyframes w5{0%,55.56%{opacity:0;transform:translateY(14px)}57.56%,64.67%{opacity:1;transform:none}66.67%,100%{opacity:0;transform:translateY(-14px)}}
  .w6{animation:w6 21.599999999999998s infinite}@keyframes w6{0%,66.67%{opacity:0;transform:translateY(14px)}68.67%,75.78%{opacity:1;transform:none}77.78%,100%{opacity:0;transform:translateY(-14px)}}
  .w7{animation:w7 21.599999999999998s infinite}@keyframes w7{0%,77.78%{opacity:0;transform:translateY(14px)}79.78%,86.89%{opacity:1;transform:none}88.89%,100%{opacity:0;transform:translateY(-14px)}}
  .w8{animation:w8 21.599999999999998s infinite}@keyframes w8{0%,88.89%{opacity:0;transform:translateY(14px)}90.89%,98.00%{opacity:1;transform:none}100.00%,100%{opacity:0;transform:translateY(-14px)}}
</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#grid)" opacity=".5"/>
  <circle class="o1" cx="180" cy="80" r="260" fill="url(#o1)"/>
  <circle class="o2" cx="1050" cy="330" r="300" fill="url(#o2)"/>
  <circle class="o3" cx="760" cy="40" r="220" fill="url(#o3)"/>
  <rect class="scan" x="0" y="0" width="1200" height="140" fill="url(#scan)"/>
</g>
<rect x=".5" y=".5" width="1199" height="399" rx="22" fill="none" stroke="#d6e0dc"/>
<g transform="translate(72 0)">
  <g class="in1">
    <rect x="0" y="58" width="64" height="64" rx="16" fill="#0a7560"/>
    <text x="32" y="102" font-size="32" font-weight="900" fill="#f7faf8" text-anchor="middle">E5</text>
    <text x="84" y="106" font-size="50" font-weight="900" fill="#10171c" letter-spacing="-1.5">EpiFive</text>
    <rect x="292" y="76" width="160" height="28" rx="14" fill="#dff0e9" stroke="#0a7560"/>
    <text x="372" y="95" font-size="13" font-weight="800" fill="#0a7560" text-anchor="middle">OPEN SOURCE · MIT</text>
  </g>
  <text class="in2" x="0" y="178" font-size="30" font-weight="700" fill="#10171c">Self-hostable SaaS for</text>
  <g transform="translate(0 228)"><g class="in2">
    <text class="w0" x="0" y="0" font-size="36" font-weight="900" fill="url(#txt)">uptime monitoring &amp; status pages</text>
    <text class="w1" x="0" y="0" font-size="36" font-weight="900" fill="url(#txt)">cookieless web analytics</text>
    <text class="w2" x="0" y="0" font-size="36" font-weight="900" fill="url(#txt)">AI voice agents</text>
    <text class="w3" x="0" y="0" font-size="36" font-weight="900" fill="url(#txt)">social media scheduler</text>
    <text class="w4" x="0" y="0" font-size="36" font-weight="900" fill="url(#txt)">team inbox, campaigns &amp; chatbots</text>
    <text class="w5" x="0" y="0" font-size="36" font-weight="900" fill="url(#txt)">SEO rank tracker &amp; site audit</text>
    <text class="w6" x="0" y="0" font-size="36" font-weight="900" fill="url(#txt)">social proof &amp; testimonial widgets</text>
    <text class="w7" x="0" y="0" font-size="36" font-weight="900" fill="url(#txt)">affiliate &amp; referral programs</text>
    <text class="w8" x="0" y="0" font-size="36" font-weight="900" fill="url(#txt)">156 online tools website</text>
  </g></g>
  <text class="in3" x="0" y="282" font-size="17" fill="#5f6c75">Web installer · admin panel · plans &amp; payments · docs · a live demo for every product</text>
  <g transform="translate(0 310)"><g class="in4" font-size="15" font-weight="800">
    <rect width="180" height="42" rx="21" fill="#0a7560"/><text x="90" y="27" fill="#f7faf8" text-anchor="middle">9 SaaS products</text>
    <rect x="194" width="166" height="42" rx="21" fill="none" stroke="#0a7560" stroke-width="1.5"/><text x="277" y="27" fill="#0a7560" text-anchor="middle">12 public repos</text>
    <rect x="374" width="176" height="42" rx="21" fill="none" stroke="#b5791b" stroke-width="1.5"/><text x="462" y="27" fill="#b5791b" text-anchor="middle">Next.js 16 + TS</text>
  </g></g>
</g>
<g transform="translate(800 72)">
  <g transform="translate(0 0)"><g class="float f1">
    <rect width="148" height="74" rx="14" fill="#ffffff" stroke="#d6e0dc"/>
    <circle cx="22" cy="25" r="7" fill="#0a7560"/>
    <text x="36" y="30" font-size="15" font-weight="800" fill="#10171c">Statuszen</text>
    <rect x="14" y="48" width="120" height="7" rx="3.5" fill="#d6e0dc"/>
    <rect class="bar b0" x="14" y="48" width="120" height="7" rx="3.5" fill="#0a7560"/>
  </g></g>
  <g transform="translate(160 34)"><g class="float f2">
    <rect width="148" height="74" rx="14" fill="#ffffff" stroke="#d6e0dc"/>
    <circle cx="22" cy="25" r="7" fill="#4f5bd5"/>
    <text x="36" y="30" font-size="15" font-weight="800" fill="#10171c">Pulsezen</text>
    <rect x="14" y="48" width="120" height="7" rx="3.5" fill="#d6e0dc"/>
    <rect class="bar b1" x="14" y="48" width="120" height="7" rx="3.5" fill="#0a7560"/>
  </g></g>
  <g transform="translate(0 104)"><g class="float f3">
    <rect width="148" height="74" rx="14" fill="#ffffff" stroke="#d6e0dc"/>
    <circle cx="22" cy="25" r="7" fill="#b5791b"/>
    <text x="36" y="30" font-size="15" font-weight="800" fill="#10171c">Dialzen</text>
    <rect x="14" y="48" width="120" height="7" rx="3.5" fill="#d6e0dc"/>
    <rect class="bar b2" x="14" y="48" width="120" height="7" rx="3.5" fill="#0a7560"/>
  </g></g>
  <g transform="translate(160 138)"><g class="float f1">
    <rect width="148" height="74" rx="14" fill="#ffffff" stroke="#d6e0dc"/>
    <circle cx="22" cy="25" r="7" fill="#0a7560"/>
    <text x="36" y="30" font-size="15" font-weight="800" fill="#10171c">Queuezen</text>
    <rect x="14" y="48" width="120" height="7" rx="3.5" fill="#d6e0dc"/>
    <rect class="bar b3" x="14" y="48" width="120" height="7" rx="3.5" fill="#0a7560"/>
  </g></g>
</g>
</svg>
